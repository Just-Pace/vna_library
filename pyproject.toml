[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vna-library"
version = "0.1.0"
description = "Python control library for the Keysight E5071C ENA vector network analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyvisa>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
